      '<div class="formula-card">' +
        '<p class="f">EV = equity × (pot + 2 × bet) − bet</p>' +
        '<p>Example — flop, flush draw (9 outs → 36%), pot €120, bet €80:<br>' +
        '<span class="mono">0.36 × (120 + 160) − 80 = 0.36 × 280 − 80 = 100.8 − 80 ≈ <strong>+€21</strong> → call</span></p>' +
      '</div>' +
      '<p>Same answer via pot odds: you risk €80 to win €280 → you need 80/280 ≈ 28.6% equity. You have ~36% → the call prints money.</p>' +
    '</section>' +
    '<section>' +
      '<h3>4 · Punch it in</h3>' +
      '<p>Type the EV on the keypad — <strong>sign included</strong> (+ for a profitable call, − for a losing one). Round to whole euros. Precision mode sets the tolerance: exact ±5, casual ±20, loose ±50. After each hand the dealer shows the full solution — and if you miss, the coach walks through every step.</p>' +
    '</section>' +
    '<section>' +
      '<h3>The draws you&#39;ll face</h3>' +
      '<div class="draws-table"><table>' +
        '<thead><tr><th>Draw</th><th>Outs</th><th style="display:none">Flop equity</th><th>Turn equity</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table></div>' +
    '</section>' +
    '<section class="kbd-note">' +
      suitIconHTML("s", 26) +
      '<p><strong>Keyboard:</strong> digits type directly, <span class="k">−</span> toggles sign, <span class="k">⌫</span> deletes, <span class="k">Enter</span> locks in, <span class="k">N</span> deals the next hand.</p>' +
    '</section>' +
  '</div>';
}

/* ------------------------------ state & actions ------------------------------ */
const S = {
  settings: loadSettings(),
  history: loadHistory(),
  scenario: null,
  phase: "deal",
  sign: "+",
  digits: "",
  result: null,
  range: "week",
  confirmClear: false,
  helpOpen: false,
  dealStart: Date.now(),
};
S.scenario = generateScenario(S.settings.streetMode, S.settings.stakes, S.settings.tolerance);

/* scroll reveals */
const revealIO = ("IntersectionObserver" in window)
  ? new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("reveal-in"); revealIO.unobserve(e.target); } });
    }, { threshold: 0.12 })
  : null;
function observeReveals() {
  document.querySelectorAll(".reveal:not(.reveal-in)").forEach((elx) => {
    if (revealIO) revealIO.observe(elx);
    else elx.classList.add("reveal-in");
  });
}

function renderTable() {
  $("#tableScene").innerHTML = tableSceneHTML(S.scenario, S.result ? { correct: S.result.correct } : null);
  $("#handPrompt").innerHTML =
    'Villain bets <b>€' + usd(S.scenario.bet) + '</b> into <b>€' + usd(S.scenario.pot) +
    '</b> — is your call <span class="plus">+EV</span> or <span class="minus">−EV</span>? Compute it, then lock in the number.';
}
function renderTerminal() { $("#terminal").innerHTML = terminalHTML(); }
function renderSession() { $("#sessionStrip").innerHTML = sessionStripHTML(); }
function renderStats() {
  $("#ledger").innerHTML = statsPanelHTML();
  observeReveals();
}
function renderSegs() {
  const map = [
    ["#segStreet", "streetMode", S.settings.streetMode],
    ["#segStakes", "stakes", S.settings.stakes],
    ["#segTol", "tolerance", String(S.settings.tolerance)],
  ];
  map.forEach((row) => {
    document.querySelectorAll(row[0] + " .seg-btn").forEach((b) => {
      b.classList.toggle("seg-on", b.dataset.val === String(row[2]));
    });
  });
}
function renderHeader() {
  const streak = currentStreak(S.history);
  $("#streakVal").textContent = streak;
  const flame = $("#streakFlame");
  flame.classList.toggle("flame-pulse", streak >= 3);
  flame.classList.toggle("flame-idle", streak < 3);
  const pill = $("#allTimePill");
  if (S.history.length) {
    const acc = (S.history.filter((r) => r.correct).length / S.history.length) * 100;
    pill.style.display = "";
    $("#allTimeVal").textContent = acc.toFixed(0) + "%";
  } else {
    pill.style.display = "none";
  }
  const musicBtn = $("#musicBtn");
  musicBtn.classList.toggle("on", S.settings.music);
  musicBtn.setAttribute("aria-pressed", S.settings.music ? "true" : "false");
  $("#eqBars").classList.toggle("hidden", !S.settings.music);
  const sfxBtn = $("#sfxBtn");
  sfxBtn.classList.toggle("on", S.settings.sfx);
  sfxBtn.setAttribute("aria-pressed", S.settings.sfx ? "true" : "false");
}

function newHand() {
  S.scenario = generateScenario(S.settings.streetMode, S.settings.stakes, S.settings.tolerance);
  S.phase = "deal";
  S.sign = "+";
  S.digits = "";
  S.result = null;
  S.dealStart = Date.now();
  sound.cardDeal();
  renderTable();
  renderTerminal();
}

function submit() {
  if (S.phase !== "deal" || S.digits.length === 0) return;
  const n = parseInt(S.digits, 10);
  const entered = S.sign === "-" && n !== 0 ? -n : n;
  const actual = S.scenario.actualEV;
  const dev = Math.abs(entered - actual);
  const correct = dev <= S.settings.tolerance;
  const signOk = entered === 0 ? actual === 0 : Math.sign(entered) === Math.sign(actual);

  S.history.push({
    t: Date.now(),
    street: S.scenario.street,
    outs: S.scenario.draw.outs,
    drawLabel: S.scenario.draw.label + " (" + S.scenario.draw.outs + " outs)",
    pot: S.scenario.pot,
    bet: S.scenario.bet,
    actual, entered, correct, signOk,
    ms: Date.now() - S.dealStart,
    tolerance: S.settings.tolerance,
  });
  saveHistory(S.history);
  S.result = { entered, actual, correct, signOk, dev };
  S.phase = "revealed";
  sound.submit();
  window.setTimeout(() => (correct ? sound.correct() : sound.wrong()), 240);
  if (!correct) {
    const term = $("#terminal");
    term.classList.remove("shake");
    void term.offsetWidth;
    term.classList.add("shake");
  }
  renderTable();
  renderTerminal();
  renderSession();
  renderStats();
  renderHeader();
}

function handleKey(kind, payload) {
  if (S.phase !== "deal") return;
  if (kind === "digit") {
    if (S.digits.length < 6) S.digits += payload;
  } else if (kind === "sign") {
    S.sign = S.sign === "+" ? "-" : "+";
  } else if (kind === "back") {
    S.digits = S.digits.slice(0, -1);
  } else if (kind === "clear") {
    S.digits = "";
    S.sign = "+";
  } else if (kind === "submit") {
    submit();
    return;
  }
  renderTerminal();
}

function updateSettings(patch, regen) {
  S.settings = Object.assign({}, S.settings, patch);
  saveSettings(S.settings);
  renderSegs();
  renderHeader();
  if (regen) newHand();
  else renderTerminal();
}

/* ------------------------------ wiring ------------------------------ */

/* arm music on the very first gesture (autoplay rules) */
let musicArmed = false;
function armMusic() {
  if (musicArmed) return;
  musicArmed = true;
  if (S.settings.music) sound.setMusic(true);
  window.removeEventListener("pointerdown", armMusic);
  window.removeEventListener("keydown", armMusic);
}
window.addEventListener("pointerdown", armMusic);
window.addEventListener("keydown", armMusic);

/* delegated clicks */
document.addEventListener("click", (e) => {
  const keyBtn = e.target.closest("[data-key]");
  if (keyBtn) {
    if (keyBtn.hasAttribute("disabled")) return;
    if (S.phase !== "deal") return;
    const k = keyBtn.dataset.key;
    if (k === "submit") sound.keyGold(); else sound.keyTap();
    if (/^[0-9]$/.test(k)) handleKey("digit", k);
    else handleKey(k);
    return;
  }
  const segBtn = e.target.closest("[data-seg]");
  if (segBtn) {
    const seg = segBtn.dataset.seg;
    const val = segBtn.dataset.val;
    if (seg === "street") updateSettings({ streetMode: val }, true);
    else if (seg === "stakes") updateSettings({ stakes: val }, true);
    else if (seg === "tol") updateSettings({ tolerance: parseInt(val, 10) }, true);
    return;
  }
  const rangeBtn = e.target.closest("[data-range]");
  if (rangeBtn) {
    S.range = rangeBtn.dataset.range;
    renderStats();
    return;
  }
  const actBtn = e.target.closest("[data-act]");
  if (actBtn) {
    const act = actBtn.dataset.act;
    if (act === "next") newHand();
    else if (act === "open-help") { S.helpOpen = true; $("#helpModal").classList.remove("hidden"); }
    else if (act === "close-help") { S.helpOpen = false; $("#helpModal").classList.add("hidden"); }
    else if (act === "ask-reset") { S.confirmClear = true; renderStats(); }
    else if (act === "cancel-reset") { S.confirmClear = false; renderStats(); }
    else if (act === "do-reset") {
      S.history = [];
      saveHistory([]);
      S.confirmClear = false;
      renderStats();
      renderSession();
      renderHeader();
    }
    return;
  }
  if (e.target.id === "helpModal") { S.helpOpen = false; $("#helpModal").classList.add("hidden"); }
});

/* physical keyboard */
window.addEventListener("keydown", (e) => {
  if (S.helpOpen) {
    if (e.key === "Escape") { S.helpOpen = false; $("#helpModal").classList.add("hidden"); }
    return;
  }
  if (S.phase === "revealed" && (e.key.toLowerCase() === "n" || e.key === "Enter")) {
    e.preventDefault();
    newHand();
    return;
  }
  if (/^[0-9]$/.test(e.key)) { sound.keyTap(); handleKey("digit", e.key); }
  else if (e.key === "Backspace") { sound.keyTap(); handleKey("back"); }
  else if (e.key === "-" || e.key === "+") { sound.keyTap(); handleKey("sign"); }
  else if (e.key === "Enter") { e.preventDefault(); sound.keyGold(); handleKey("submit"); }
  else if (e.key === "Escape") { sound.keyTap(); handleKey("clear"); }
});

$("#musicBtn").addEventListener("click", () => {
  const next = !S.settings.music;
  sound.setMusic(next);
  updateSettings({ music: next });
  sound.uiToggle(next);
});
$("#sfxBtn").addEventListener("click", () => {
  const next = !S.settings.sfx;
  updateSettings({ sfx: next });
  sound.uiToggle(next);
});

/* ------------------------------ init ------------------------------ */
$("#helpCard").innerHTML = helpHTML();
renderSegs();
renderHeader();
renderTable();
renderTerminal();
renderSession();
renderStats();
</script>
</body>
</html>
